[project]
name = "web-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.3",
    "jinja2>=3.1", "python-multipart>=0.0.9", "rpc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_service"]
